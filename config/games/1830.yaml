title: "1830: Railways & Robber Barons"
description: "The classic 18xx game covering the northeastern United States"

# Dividend settings
bank_shares_pay_company: false  # Shares in bank pool do not pay dividends to company
ipo_shares_pay_company: false   # Shares in IPO do not pay dividends to company

player_configs:
  - player_count: 3
    starting_money: 600
    bank_money: 11400  # 12000 - (3 * 600)
  - player_count: 4
    starting_money: 450
    bank_money: 10200  # 12000 - (4 * 450)
  - player_count: 5
    starting_money: 360
    bank_money: 10200  # 12000 - (5 * 360)
  - player_count: 6
    starting_money: 300
    bank_money: 10200  # 12000 - (6 * 300)

companies:
  - id: "PRR"
    name: "Pennsylvania Railroad"
    shares: 10
  - id: "NYC"
    name: "New York Central Railroad"
    shares: 10
  - id: "BO"
    name: "Baltimore & Ohio Railroad"
    shares: 10
  - id: "CPR"
    name: "Canadian Pacific Railway"
    shares: 10
  - id: "ERIE"
    name: "Erie Railroad"
    shares: 10
  - id: "NYNH"
    name: "New York, New Haven & Hartford Railroad"
    shares: 10
  - id: "CO"
    name: "Chesapeake & Ohio Railway"
    shares: 10
  - id: "LV"
    name: "Lehigh Valley Railroad"
    shares: 10